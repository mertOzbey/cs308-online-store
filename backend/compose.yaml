services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cs308
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: cs308
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs308 -d cs308"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
